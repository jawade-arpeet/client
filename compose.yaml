services:
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch-wolfi:8.19.26
        environment:
            discovery.type: single-node
            xpack.security.enabled: "false"
            xpack.ml.enabled: "false"
            ES_JAVA_OPTS: "-Xms512m -Xmx512m"
        mem_limit: 1g
        ports:
            - "127.0.0.1:9200:9200"
        volumes:
            - elasticsearch-data:/usr/share/elasticsearch/data
        healthcheck:
            test:
                [
                    "CMD",
                    "curl",
                    "-fsS",
                    "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s",
                ]
            interval: 10s
            timeout: 8s
            retries: 12
            start_period: 30s

volumes:
    elasticsearch-data:
